name: Generate Pacman Contribution Graph

on:
  schedule:
    - cron: "0 */12 * * *" # Otomatis update tiap 12 jam
  workflow_dispatch: # Bisa di-run manual

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: marcelo-ribeiro/pacman-contribution-graph@main
        with:
          github_user_name: YuuAntiSuki
