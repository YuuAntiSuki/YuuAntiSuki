<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" width="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; rx: 12px; }
      .board-light { fill: #eeeed2; }
      .board-dark { fill: #769656; }
      .board-border { fill: none; stroke: #00F0FF; stroke-width: 2px; }
      .title { fill: #00F0FF; font-family: 'Fira Code', monospace; font-size: 18px; font-weight: 800; text-anchor: middle; }
      .sub { fill: #8b949e; font-family: 'Fira Code', monospace; font-size: 11px; text-anchor: middle; }
      .piece { font-size: 28px; text-anchor: middle; dominant-baseline: central; font-family: sans-serif; }
      
      /* Pure CSS Keyframes Animation for Moves */
      @keyframes moveE2E4 {
        0%, 10% { transform: translate(0px, 0px); }
        20%, 85% { transform: translate(0px, -80px); }
        95%, 100% { transform: translate(0px, 0px); }
      }
      @keyframes moveC7C5 {
        0%, 25% { transform: translate(0px, 0px); }
        35%, 85% { transform: translate(0px, 80px); }
        95%, 100% { transform: translate(0px, 0px); }
      }
      @keyframes moveG1F3 {
        0%, 40% { transform: translate(0px, 0px); }
        50%, 85% { transform: translate(-40px, -80px); }
        95%, 100% { transform: translate(0px, 0px); }
      }
      @keyframes moveB8C6 {
        0%, 55% { transform: translate(0px, 0px); }
        65%, 85% { transform: translate(40px, 80px); }
        95%, 100% { transform: translate(0px, 0px); }
      }

      .pawn-e2 { animation: moveE2E4 8s infinite ease-in-out; }
      .pawn-c7 { animation: moveC7C5 8s infinite ease-in-out; }
      .knight-g1 { animation: moveG1F3 8s infinite ease-in-out; }
      .knight-b8 { animation: moveB8C6 8s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Title -->
  <text x="200" y="32" class="title">♟ AUTO CHESS MATCH ♟</text>

  <!-- Board 8x8 -->
  <g transform="translate(40, 50)">
    <!-- Board Squares -->
    <!-- Row 8 -->
    <rect x="0" y="0" width="40" height="40" class="board-light"/><rect x="40" y="0" width="40" height="40" class="board-dark"/>
    <rect x="80" y="0" width="40" height="40" class="board-light"/><rect x="120" y="0" width="40" height="40" class="board-dark"/>
    <rect x="160" y="0" width="40" height="40" class="board-light"/><rect x="200" y="0" width="40" height="40" class="board-dark"/>
    <rect x="240" y="0" width="40" height="40" class="board-light"/><rect x="280" y="0" width="40" height="40" class="board-dark"/>

    <!-- Row 7 -->
    <rect x="0" y="40" width="40" height="40" class="board-dark"/><rect x="40" y="40" width="40" height="40" class="board-light"/>
    <rect x="80" y="40" width="40" height="40" class="board-dark"/><rect x="120" y="40" width="40" height="40" class="board-light"/>
    <rect x="160" y="40" width="40" height="40" class="board-dark"/><rect x="200" y="40" width="40" height="40" class="board-light"/>
    <rect x="240" y="40" width="40" height="40" class="board-dark"/><rect x="280" y="40" width="40" height="40" class="board-light"/>

    <!-- Row 6 -->
    <rect x="0" y="80" width="40" height="40" class="board-light"/><rect x="40" y="80" width="40" height="40" class="board-dark"/>
    <rect x="80" y="80" width="40" height="40" class="board-light"/><rect x="120" y="80" width="40" height="40" class="board-dark"/>
    <rect x="160" y="80" width="40" height="40" class="board-light"/><rect x="200" y="80" width="40" height="40" class="board-dark"/>
    <rect x="240" y="80" width="40" height="40" class="board-light"/><rect x="280" y="80" width="40" height="40" class="board-dark"/>

    <!-- Row 5 -->
    <rect x="0" y="120" width="40" height="40" class="board-dark"/><rect x="40" y="120" width="40" height="40" class="board-light"/>
    <rect x="80" y="120" width="40" height="40" class="board-dark"/><rect x="120" y="120" width="40" height="40" class="board-light"/>
    <rect x="160" y="120" width="40" height="40" class="board-dark"/><rect x="200" y="120" width="40" height="40" class="board-light"/>
    <rect x="240" y="120" width="40" height="40" class="board-dark"/><rect x="280" y="120" width="40" height="40" class="board-light"/>

    <!-- Row 4 -->
    <rect x="0" y="160" width="40" height="40" class="board-light"/><rect x="40" y="160" width="40" height="40" class="board-dark"/>
    <rect x="80" y="160" width="40" height="40" class="board-light"/><rect x="120" y="160" width="40" height="40" class="board-dark"/>
    <rect x="160" y="160" width="40" height="40" class="board-light"/><rect x="200" y="160" width="40" height="40" class="board-dark"/>
    <rect x="240" y="160" width="40" height="40" class="board-light"/><rect x="280" y="160" width="40" height="40" class="board-dark"/>

    <!-- Row 3 -->
    <rect x="0" y="200" width="40" height="40" class="board-dark"/><rect x="40" y="200" width="40" height="40" class="board-light"/>
    <rect x="80" y="200" width="40" height="40" class="board-dark"/><rect x="120" y="200" width="40" height="40" class="board-light"/>
    <rect x="160" y="200" width="40" height="40" class="board-dark"/><rect x="200" y="200" width="40" height="40" class="board-light"/>
    <rect x="240" y="200" width="40" height="40" class="board-dark"/><rect x="280" y="200" width="40" height="40" class="board-light"/>

    <!-- Row 2 -->
    <rect x="0" y="240" width="40" height="40" class="board-light"/><rect x="40" y="240" width="40" height="40" class="board-dark"/>
    <rect x="80" y="240" width="40" height="40" class="board-light"/><rect x="120" y="240" width="40" height="40" class="board-dark"/>
    <rect x="160" y="240" width="40" height="40" class="board-light"/><rect x="200" y="240" width="40" height="40" class="board-dark"/>
    <rect x="240" y="240" width="40" height="40" class="board-light"/><rect x="280" y="240" width="40" height="40" class="board-dark"/>

    <!-- Row 1 -->
    <rect x="0" y="280" width="40" height="40" class="board-dark"/><rect x="40" y="280" width="40" height="40" class="board-light"/>
    <rect x="80" y="280" width="40" height="40" class="board-dark"/><rect x="120" y="280" width="40" height="40" class="board-light"/>
    <rect x="160" y="280" width="40" height="40" class="board-dark"/><rect x="200" y="280" width="40" height="40" class="board-light"/>
    <rect x="240" y="280" width="40" height="40" class="board-dark"/><rect x="280" y="280" width="40" height="40" class="board-light"/>

    <rect x="0" y="0" width="320" height="320" class="board-border"/>

    <!-- Black Pieces -->
    <text x="20" y="20" class="piece">♜</text>
    <text x="60" y="20" class="piece knight-b8">♞</text>
    <text x="100" y="20" class="piece">♝</text>
    <text x="140" y="20" class="piece">♛</text>
    <text x="180" y="20" class="piece">♚</text>
    <text x="220" y="20" class="piece">♝</text>
    <text x="260" y="20" class="piece">♞</text>
    <text x="300" y="20" class="piece">♜</text>

    <text x="20" y="60" class="piece">♟</text>
    <text x="60" y="60" class="piece">♟</text>
    <text x="100" y="60" class="piece pawn-c7">♟</text>
    <text x="140" y="60" class="piece">♟</text>
    <text x="180" y="60" class="piece">♟</text>
    <text x="220" y="60" class="piece">♟</text>
    <text x="260" y="60" class="piece">♟</text>
    <text x="300" y="60" class="piece">♟</text>

    <!-- White Pieces -->
    <text x="20" y="260" class="piece">♙</text>
    <text x="60" y="260" class="piece">♙</text>
    <text x="100" y="260" class="piece">♙</text>
    <text x="140" y="260" class="piece">♙</text>
    <text x="180" y="260" class="piece pawn-e2">♙</text>
    <text x="220" y="260" class="piece">♙</text>
    <text x="260" y="260" class="piece">♙</text>
    <text x="300" y="260" class="piece">♙</text>

    <text x="20" y="300" class="piece">♖</text>
    <text x="60" y="300" class="piece">♘</text>
    <text x="100" y="300" class="piece">♗</text>
    <text x="140" y="300" class="piece">♕</text>
    <text x="180" y="300" class="piece">♔</text>
    <text x="220" y="300" class="piece">♗</text>
    <text x="260" y="300" class="piece knight-g1">♘</text>
    <text x="300" y="300" class="piece">♖</text>
  </g>

  <!-- Footer Subtitle -->
  <text x="200" y="402" class="sub">🤖 Pure SVG &amp; CSS Animation — Auto Tactical Sicilian Opening</text>
</svg>
